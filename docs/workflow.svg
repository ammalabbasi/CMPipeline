<svg xmlns="http://www.w3.org/2000/svg" width="1000" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 1000 1464" role="img" aria-label="CMPipeline workflow: input, host depletion, classification, consensus, optional decontamination and batch correction, reporting"><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="24" width="934" height="140" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="45">INPUT</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="64" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="82">sample sheet <tspan class='m'>patient, bam | cram | fastq_1</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="97">IDs must be unique; paths checked at ingestion</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="118" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="136">metadata TSV <tspan class='m'>patient, sample_type, shipment_batch</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="151">decontamination only</text><path stroke="#6f6f6a" stroke-width="2" fill="none" d="M275,166 L275,176"/><path fill="#6f6f6a" d="M270,171 L275,178 L280,171 Z"/><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="180" width="934" height="248" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="201">STEP 1 — HOST DEPLETION</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="220" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="238">extractReads <tspan class='m'>samtools fastq -N</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="253">BAM/CRAM only; FASTQ input skips this</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="274" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="292">filterReads <tspan class='m'>fastp -l 45</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="307">--adapter_trim auto | always | never</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="328" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="346">mapReads <tspan class='m'>minimap2</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="361">GRCh38, then T2T+PhiX, then pangenome (optional)</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="382" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="400">FASTQC x5</text><text font-size="11" fill="#6f6f6a" x="53" y="415">raw, filtered, and each depletion stage</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="240">UNMAPPED_BAM/ &lt;sample&gt;.UNMAPPED.fq.gz</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="294">UNMAPPED_BAM/ &lt;sample&gt;.fastp.json    -> QC</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="348">MAPPED_READS/ &lt;sample&gt;.host_depleted.fq.gz</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="402">&lt;sample&gt;.depletion_counts.tsv  -> retention</text><path stroke="#6f6f6a" stroke-width="2" fill="none" d="M275,430 L275,440"/><path fill="#6f6f6a" d="M270,435 L275,442 L280,435 Z"/><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="444" width="934" height="194" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="465">STEP 2 — CLASSIFICATION</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="484" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="502">Bracken <tspan class='m'>KrakenUniq -&gt; Bracken G/S</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="517">also computes the microbial read count</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="538" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="556">gate: reads &#8805; --consensus_min_reads</text><text font-size="11" fill="#6f6f6a" x="53" y="571">below it, MetaPhlAn is skipped for that sample</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="592" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="610">metaphlan4</text><text font-size="11" fill="#6f6f6a" x="53" y="625">only for samples above the gate</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="504">BRACKEN/ &lt;sample&gt;.krakenuniq.report.txt</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="558">BRACKEN/ &lt;sample&gt;.bracken.&#123;G,S&#125;.report.txt</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="612">METAPHLAN4/ &lt;sample&gt;.profiled_metagenome.txt</text><path stroke="#6f6f6a" stroke-width="2" fill="none" d="M275,640 L275,650"/><path fill="#6f6f6a" d="M270,645 L275,652 L280,645 Z"/><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="654" width="934" height="140" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="675">STEP 3 — CONSENSUS</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="694" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="712">consensus_taxa</text><text font-size="11" fill="#6f6f6a" x="53" y="727">genera supported by BOTH profilers</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="714">CONSENSUS_TAXA/ bracken.metaphlan.</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="768">common.&#123;genus,species&#125;.mpa.report.txt</text><path stroke="#6f6f6a" stroke-width="2" fill="none" d="M275,796 L275,806"/><path fill="#6f6f6a" d="M270,801 L275,808 L280,801 Z"/><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="810" width="934" height="194" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="831">STEP 4 — DECONTAMINATION   (optional)</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="850" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="868">Decontamination <tspan class='m'>decontam</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="883">needs controls; 4 role flags are required</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="870">04_DECONTAMINATION/ ...decontaminated.csv</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="924">contaminants_final.tsv, filter_report.tsv</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="978">sample_validation.tsv, run_manifest.tsv</text><path stroke="#6f6f6a" stroke-width="2" fill="none" d="M275,1006 L275,1016"/><path fill="#6f6f6a" d="M270,1011 L275,1018 L280,1011 Z"/><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="1020" width="934" height="140" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="1041">STEP 5 — BATCH CORRECTION   (optional)</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="1060" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="1078">BatchCorrection <tspan class='m'>ConQuR</tspan></text><text font-size="11" fill="#6f6f6a" x="53" y="1093">PERMANOVA, PCoA, CLR / RCLR</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="1080">05_BATCH_CORRECTION/ corrected/,</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="1134">normalized/, pcoa_plots/</text><path stroke="#6f6f6a" stroke-width="2" fill="none" d="M275,1162 L275,1172"/><path fill="#6f6f6a" d="M270,1167 L275,1174 L280,1167 Z"/><rect fill="#f2f4f7" stroke="#e4e4df" x="26" y="1176" width="934" height="248" rx="9"/><text font-size="12" font-weight="700" letter-spacing="0.07em" fill="#6f6f6a" x="40" y="1197">REPORTING   (every run)</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="1216" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="1234">multiqc</text><text font-size="11" fill="#6f6f6a" x="53" y="1249">fastp JSON plus all five FastQC passes</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="1270" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="1288">qcSummary -&gt; cohortReport</text><text font-size="11" fill="#6f6f6a" x="53" y="1303">one row per sample, then the HTML page</text><rect fill="#fcfcfb" stroke="#e4e4df" x="40" y="1324" width="470" height="42" rx="6"/><text font-size="13" font-weight="600" fill="#1a1a19" x="53" y="1342">provenance -&gt; RUN_REPORT.txt</text><text font-size="11" fill="#6f6f6a" x="53" y="1357">written before task 1, finalised at the end</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="1236">MULTIQC/ multiqc_report.html</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="1290">QC_SUMMARY/ cmp.qc.summary.tsv  (29 cols)</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="1344">QC_SUMMARY/ cmp_cohort_report.html</text><text font-size="11.5" fill="#4a4a47" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" x="560" y="1398">pipeline_info/ RUN_REPORT.txt, trace.txt</text></svg>