# Batch correction (ConQuR) + normalisation. Versions pinned to the 2026-09-23 build. The exact
# build is conda_envs/lock/batch_correction_env.linux-64.txt. ConQuR's CRAN dependencies now come
# from conda-forge (audit D03): previously 28 of them were installed from CRAN at whatever version
# CRAN served. Two things remain outside conda, installed by scripts/install_conqur.R at EXACT
# versions: cqrReg 1.2.1 (not on conda-forge) and ConQuR itself (ivartb/ConQuR_par@ff233085).
# ConQuR is the ivartb/ConQuR_par fork, not the upstream ConQuR repository, at the commit in
# params.conqur_sha (main.nf); Modules/batch_correction.nf refuses any other install (audit A14/A17).
# Change the pin in main.nf and scripts/install_conqur.R together (tests/test_docs.py checks).
# Nextflow does not build this env: params.batch_corr_env points at a pre-built env with ConQuR
# installed (conda_envs/build_envs.sbatch), because a fresh build would lack it (audit D04).
name: batch_correction_env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Every package pinned (audit D03): the unpinned ones took the versions in
  # lock/batch_correction_env.linux-64.txt, the env the pipeline was verified with.
  - r-base=4.3.3
  - compilers=2.0.0
  - make=4.4.1
  - r-tidyverse=2.0.0
  - r-argparse=2.2.5
  - r-remotes=2.5.0
  - r-vegan=2.6_4            # 2.6-4: ConQuR calls adonis, removed in later vegan
  - r-doparallel=1.0.17
  - r-foreach=1.5.2
  - r-iterators=1.0.14
  - r-zcompositions=1.5.0_5
  - r-dplyr=1.1.4
  - r-optparse=1.7.5
  - r-matrix=1.6_5
  # ConQuR imports (DESCRIPTION): quantreg cqrReg glmnet dplyr doParallel gplots vegan ade4
  # compositions randomForest ROCR ape GUniFrac fastDummies
  - r-quantreg=6.1
  - r-glmnet=4.1_10
  - r-gplots=3.2.0
  - r-randomforest=4.7_1.2
  - r-ape=5.8_1
  - r-ade4=1.7_23
  - r-compositions=2.0_9
  - r-rocr=1.0_11
  - r-gunifrac=1.9
  - r-fastdummies=1.7.5
  - r-inline=0.3.21
  - r-rcpp=1.1.0
  - r-rcpparmadillo=15.0.2_1