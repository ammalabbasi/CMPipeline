name: validation_env
# Alignment validation (Modules/alignment_validation.nf). The scripts use only the Python
# standard library; minimap2 matches conda_envs/minimap2_env.yml, skani the version the
# 2026-09-23 benchmark de-duplicated with.
channels:
  - conda-forge
  - bioconda
  - nodefaults   # audit D07
dependencies:
  - python=3.11
  - minimap2=2.28
  - skani=0.3.1
  - pigz=2.8
