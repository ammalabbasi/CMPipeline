# HUMAnN 3.9 requires metaphlan >= 4.0; the earlier file pinned MetaPhlAn 3.0.13, which could not
# solve as written (audit D05). MetaPhlAn matches metaphlan4_env (4.1.1). Needs ChocoPhlAn
# v201901_v31 (the MetaPhlAn-4 generation) and UniRef90 v201901b -- see --humann3_nucleotide_db.
# The exact build is conda_envs/lock/humann3_env.linux-64.txt; this file is its source.
name: humann3_env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - humann=3.9
  - metaphlan=4.1.1
  - bowtie2=2.5.4
  - diamond=2.1.12
