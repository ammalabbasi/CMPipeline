# ConQuR from the ivartb/ConQuR_par fork at the commit in params.conqur_sha (main.nf), with the
# same Remote* DESCRIPTION fields install_github writes, so the module's RemoteSha check applies.
{% set sha = "ff233085cedc36a24382038067a4cece3e94e0a0" %}

package:
  name: r-conqur
  version: "2.0"

source:
  url: https://codeload.github.com/ivartb/ConQuR_par/tar.gz/{{ sha }}
  fn: ConQuR_par-{{ sha }}.tar.gz
  sha256: 7fa9d92c693bfdf155413f4ccbbcc27627f916d290e8bd4944f10c05e82a2647

build:
  number: 0
  noarch: generic

requirements:
  host:
    - r-base 4.3.3 hc28aa72_21
    - r-cqrreg 1.2.1
    - r-quantreg 6.1 r43h012206f_0
    - r-glmnet 4.1_10 r43ha36cffa_0
    - r-dplyr 1.1.4 r43h0d4f4ea_1
    - r-doparallel 1.0.17 r43hc72bb7e_3
    - r-gplots 3.2.0 r43hc72bb7e_0
    - r-vegan 2.6_4 r43hd9ac46e_1
    - r-ade4 1.7_23 r43h3704496_2
    - r-compositions 2.0_9 r43h0e4624f_0
    - r-randomforest 4.7_1.2 r43hb67ce94_0
    - r-rocr 1.0_11 r43hc72bb7e_4
    - r-ape 5.8_1 r43h3704496_1
    - r-gunifrac 1.9 r43h3697838_0
    - r-fastdummies 1.7.5 r43hc72bb7e_0
  run:
    - r-base 4.3.3.*
    - r-cqrreg 1.2.1
    - r-quantreg
    - r-glmnet
    - r-dplyr
    - r-doparallel
    - r-gplots
    - r-vegan
    - r-ade4
    - r-compositions
    - r-randomforest
    - r-rocr
    - r-ape
    - r-gunifrac
    - r-fastdummies

test:
  commands:
    - $R -e "library('ConQuR'); stopifnot(identical(packageDescription('ConQuR')\$RemoteSha, '{{ sha }}'))"

about:
  home: https://github.com/ivartb/ConQuR_par
  license: GPL-3.0
  summary: ConQuR batch correction, ivartb/ConQuR_par fork (foreach worker fix)
