name: krakenUniq_bracken_env

# 2026-10-26 tool update. Was a 134-line `conda env export` (bracken 2.9, python 3.9, plus kraken2,
# blast, entrez-direct and perl modules the pipeline never calls). Now only what the Bracken process
# runs: krakenuniq, bracken, python (scripts/kreport2mpa.py) and the shell tools in the task.
# Same pins pksProfiler validated (fix/v1.0.0-rc4: krakenuniq 1.0.4, bracken 3.1p1, python 3.12).
# bracken 3.1p1 prints "Bracken v3.0.1" (upstream never updated VERSION); flags -d -i -o -w -r -l -t
# are unchanged. The exact build is the lockfile, conda_envs/lock/krakenUniq_bracken_env.linux-64.txt.

channels:
  - conda-forge
  - bioconda
  - nodefaults   # no Anaconda defaults channel (audit D07; the lockfile is what runs)

dependencies:
  - python=3.12
  - krakenuniq=1.0.4
  - bracken=3.1p1
  - gawk=5.3.1
  - gzip=1.13
  - coreutils=9.5
